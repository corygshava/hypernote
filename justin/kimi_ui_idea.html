<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Share Your Thoughts Instantly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .note-form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .note-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .note-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .char-counter {
            text-align: right;
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .post-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }

        .post-button:hover {
            transform: translateY(-2px);
        }

        .notes-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .notes-header {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .note-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }

        .note-card:hover {
            transform: translateX(5px);
        }

        .note-content {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .note-time {
            color: #666;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 QuickNotes</h1>
            <p>Share your thoughts with the world, instantly</p>
        </div>

        <div class="note-form">
            <textarea class="note-input" placeholder="What's on your mind? Share a quick note..." maxlength="280"></textarea>
            <div class="char-counter">0 / 280</div>
            <button class="post-button" onclick="postNote()">Post Note</button>
        </div>

        <div class="notes-container">
            <h2 class="notes-header">Recent Notes</h2>
            <div id="notes-list">
                <div class="empty-state">
                    <div class="empty-state-icon">🌟</div>
                    <p>No notes yet. Be the first to share!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load notes from localStorage
        let notes = JSON.parse(localStorage.getItem('quicknotes')) || [];

        // Character counter
        const textarea = document.querySelector('.note-input');
        const counter = document.querySelector('.char-counter');

        textarea.addEventListener('input', function() {
            counter.textContent = `${this.value.length} / 280`;
        });

        // Post note function
        function postNote() {
            const content = textarea.value.trim();
            
            if (content === '') {
                alert('Please write something before posting!');
                return;
            }

            const note = {
                content: content,
                timestamp: new Date().toISOString(),
                id: Date.now()
            };

            notes.unshift(note);
            localStorage.setItem('quicknotes', JSON.stringify(notes));
            
            textarea.value = '';
            counter.textContent = '0 / 280';
            
            displayNotes();
        }

        // Display notes
        function displayNotes() {
            const notesList = document.getElementById('notes-list');
            
            if (notes.length === 0) {
                notesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🌟</div>
                        <p>No notes yet. Be the first to share!</p>
                    </div>
                `;
                return;
            }

            notesList.innerHTML = notes.map(note => {
                const date = new Date(note.timestamp);
                const timeString = date.toLocaleString();
                
                return `
                    <div class="note-card">
                        <div class="note-content">${escapeHtml(note.content)}</div>
                        <div class="note-time">${timeString}</div>
                    </div>
                `;
            }).join('');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial display
        displayNotes();

        // Allow posting with Enter key (Shift+Enter for new line)
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                postNote();
            }
        });
    </script>
</body>
</html>
